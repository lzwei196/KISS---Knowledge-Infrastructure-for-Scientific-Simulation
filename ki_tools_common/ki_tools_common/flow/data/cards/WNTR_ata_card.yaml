risks:
  known_traps:
  - canonical_var: water_demand
    trap_id: demand_unit_lps_vs_m3s
    description: WNTR accepts demand in m3/s for SI networks (units='LPS' in INP ≠ m3/s).
      The INP file 'units' field determines the unit interpretation. If INP says 'LPS'
      but you multiply demand by 1000 assuming m3/s, actual demand is 1000× too large.
    detection: All nodes report negative pressure; simulation fails to converge
    fix: Always check the UNITS field in INP header; use wntr.network.read() and verify
      wn.options.hydraulics.units == 'LPS' before scaling demand
    is_unit_trap: true
    automatable: true
    severity: high
  - canonical_var: pressure
    trap_id: negative_pressure_pipe_failure
    description: Pipe failure scenarios cause negative pressure at downstream nodes (physical
      cavitation). WNTR's DDA (Demand-Driven Analysis) does not model this correctly;
      use PDA (Pressure-Driven Analysis) for failure scenarios.
    detection: Pressure < -5 m at multiple nodes during pipe-failure simulation
    fix: 'Switch to PDA: wn.options.hydraulics.demand_model = ''PDA''; set minimum_pressure and required_pressure'
    is_unit_trap: false
    automatable: true
    severity: medium
  - canonical_var: resilience_index
    trap_id: flood_surge_not_modeled
    description: WNTR does not model external flooding of the distribution network (pipe
      submersion, back-pressure from floodwater). CaMa-Flood inundation depth > pipe
      crown elevation is a separate impact assessment step not native to WNTR.
    detection: n/a — this is a model scope limitation
    fix: Post-process CaMa flddph to identify submerged pipes; remove those links from
      the network before running WNTR flood-scenario
    is_unit_trap: false
    automatable: false
    severity: medium
