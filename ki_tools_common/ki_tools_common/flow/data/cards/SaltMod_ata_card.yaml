risks:
  known_traps:
  - canonical_var: irrigation_water_applied
    trap_id: unit_m_per_season_not_mm
    description: SaltMod uses m/season throughout. Providing mm/day, mm/season, or
      m/yr will silently corrupt the water balance. Most hydrological models output
      mm/day or mm/yr.
    detection: Water table rising to ground surface in first season; soil salinity
      collapsing to zero
    fix: 'Convert all fluxes: mm/day × days_per_season / 1000 = m/season'
    is_unit_trap: true
    automatable: true
    severity: high
  - canonical_var: soil_salinity
    trap_id: wine_headless_run
    description: SaltMod.exe is a Windows GUI binary and must run under Wine with
      a virtual X display (Xephyr or Xvfb). Direct invocation without DISPLAY set
      causes immediate crash.
    detection: SaltMod.exe exits with code 1, no output produced
    fix: Set DISPLAY=:99; start Xvfb :99 & before invoking wine SaltMod.exe
    is_unit_trap: false
    automatable: true
    severity: high
  - canonical_var: drainage_rate
    trap_id: no_interactive_year_changes
    description: When Ky=1 in INP file, SaltMod expects interactive year-by-year parameter
      changes via GUI. Non-interactive driver cannot replicate reference outputs for
      MPRECON/INTERACT test cases. Use Ky=0 for automated runs.
    detection: SaltMod hangs waiting for GUI input after year 1
    fix: Set Ky=0 in INP file for fully automated (non-interactive) runs
    is_unit_trap: false
    automatable: true
    severity: high
