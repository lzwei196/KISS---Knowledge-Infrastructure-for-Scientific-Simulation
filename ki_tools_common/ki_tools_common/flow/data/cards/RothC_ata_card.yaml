risks:
  known_traps:
  - canonical_var: air_temperature
    trap_id: temperature_in_kelvin
    description: RothC rate modifier f(T) = 47.91 / (1 + exp(106 / (T + 18.27))). At
      T=300K (≈27°C in Kelvin), f(T) ≈ 0.0 → all decomposition halted. Carbon never
      mineralizes. CO2 near zero but no error.
    detection: CO2_evolution < 0.001 t C/ha/month for temperate warm conditions
    fix: 'CMFD/MSWX temperature: subtract 273.15 before passing to RothC'
    is_unit_trap: true
    automatable: true
    severity: high
  - canonical_var: precipitation_rate
    trap_id: prec_daily_not_monthly
    description: pyRothC soil moisture modifier uses monthly rainfall vs PET ratio.
      Passing mm/day makes every month appear very dry (ratio << 1) → decomposition
      suppressed by ~3×.
    detection: Soil always classified as dry (b=0.2) regardless of climate
    fix: Sum daily CMFD/MSWX precipitation to monthly totals before passing to RothC
    is_unit_trap: true
    automatable: true
    severity: high
  - canonical_var: carbon_input_rate
    trap_id: carbon_input_unit_conversion
    description: Carbon input must be t C/ha/month. DSSAT reports residue in kg/ha/yr;
      LPJmL/LDNDC report litter in g C/m2/day. Off by 12000× if not converted.
    detection: SOC growing at 50+ t C/ha/yr (unrealistic)
    fix: 'DSSAT kg/ha/yr ÷ 12000 = t C/ha/month; LDNDC g C/m2/day × 30.44 / 100 = t C/ha/month'
    is_unit_trap: true
    automatable: true
    severity: high
  unit_conversions:
  - from_unit: kg/ha/yr
    to_unit: t C/ha/month
    factor: 8.333e-5
    applies_to: [carbon_input_rate]
  - from_unit: g C/m2/day
    to_unit: t C/ha/month
    factor: 0.3044
    applies_to: [carbon_input_rate, co2_emission]
