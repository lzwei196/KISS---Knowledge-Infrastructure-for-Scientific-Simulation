risks:
  known_traps:
  - canonical_var: precipitation_erosivity
    trap_id: r_k_unit_mismatch
    description: R-factor and K-factor must use matched unit systems (SI or US customary).
      Mixing R in MJ*mm/(ha*h*yr) with K in tons*acre*h/(hundreds*foot-tonf*inch) gives
      erosion off by 1000×. WaTEM-SEDEM does not check for consistency.
    detection: Gross erosion > 1000 t/ha/yr for agricultural land (unrealistic)
    fix: Use SI units throughout — R [MJ*mm/(ha*h*yr)], K [t*h/(MJ*mm)]
    is_unit_trap: true
    automatable: false
    severity: high
  - canonical_var: terrain_elevation
    trap_id: dem_geographic_coordinates
    description: DEM must be in a projected coordinate system (metres). A DEM in WGS84 lat/lon
      degrees produces slope in degrees/degree (dimensionless) → LS-factor wildly wrong.
    detection: Slope values > 200% or < 0.001% across entire domain
    fix: Reproject DEM to local UTM (e.g. UTM zone 50N for Huaihe) before running WaTEM-SEDEM
    is_unit_trap: true
    automatable: true
    severity: high
  - canonical_var: land_cover_type
    trap_id: c_factor_wrong_crop_season
    description: WaTEM-SEDEM uses a single annual C-factor raster. For winter wheat-summer
      maize double-cropping (Huaihe dominant), using summer NDVI overestimates erosion
      during winter wheat cover (lower C) by 2-5×.
    detection: Erosion peaks in winter instead of summer for cropland cells
    fix: "Use area-weighted annual-average C-factor (0.4*wheat_C + 0.6*maize_C) for double-crop"
    is_unit_trap: false
    automatable: true
    severity: medium
  unit_conversions:
  - from_unit: t/yr
    to_unit: t/day
    factor: 0.002740
    applies_to: [sediment_export]
