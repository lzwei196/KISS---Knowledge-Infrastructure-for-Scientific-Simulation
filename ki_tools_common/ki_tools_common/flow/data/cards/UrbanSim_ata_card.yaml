risks:
  known_traps:
  - canonical_var: population_count
    trap_id: model_estimation_required
    description: UrbanSim models (hedonic regression, PLCM, REPM) must be estimated from
      historical data before running forward simulation. Running simulation without estimation
      produces identical output to input (no change).
    detection: Land use map identical after 5-year forward simulation
    fix: Run ORCA estimation pipeline first using historical parcel + household data.
      UrbanSim KI has s1_estimate_models.py for this step.
    is_unit_trap: false
    automatable: true
    severity: high
  - canonical_var: land_use_fraction
    trap_id: chinese_land_use_code_mapping
    description: Chinese land use classification (国家标准GB/T 21010-2017) uses different
      numeric codes than UrbanSim's default US-centric scheme. Direct code assignment
      without remapping produces wrong zoning constraints.
    detection: All parcels assigned to residential (code 1) regardless of actual land use
    fix: Apply GB/T 21010 → UrbanSim LUT ID mapping table (see UrbanSim KI docs)
    is_unit_trap: false
    automatable: true
    severity: high
  - canonical_var: discharge
    trap_id: flood_scenario_static_not_dynamic
    description: UrbanSim accepts flood depth as a static scenario parameter per parcel,
      not as a dynamic coupled state. Changes in land use do NOT feed back to flood model
      in the same time step. Coupling is explicit (annual snapshots), not inline.
    detection: n/a — design limitation
    fix: Alternate UrbanSim → SWMM (impervious change) → CaMa (flow change) → UrbanSim
      (flood depth update) at annual intervals in the coupling_orchestrator.
    is_unit_trap: false
    automatable: false
    severity: medium
