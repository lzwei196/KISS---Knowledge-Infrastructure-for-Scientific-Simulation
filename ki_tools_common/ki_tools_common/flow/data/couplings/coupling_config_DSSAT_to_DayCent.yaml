risks:
  total_traps: 2
  automatable: 2
  judgment_required: 0
  traps:
  - canonical_var: litter_carbon
    model: DSSAT->DayCent
    trap_id: biomass_includes_grain_in_residue
    description: DSSAT total_biomass includes grain. If grain_yield is not subtracted
      before computing residue, DayCent receives 2-3× too much litter carbon, causing
      SOC divergence.
    detection: DayCent SOC increases > 2 t C/ha in first simulation year
    fix: litter_C = (biomass - grain_yield) * 0.45; never use raw biomass as litter input
    is_unit_trap: false
    automatable: true
  - canonical_var: litter_carbon
    model: DSSAT->DayCent
    trap_id: litter_unit_kgha_to_gcm2
    description: DSSAT reports in kg/ha; DayCent expects gC/m2. Off by 10× if not
      converted (gC/m2 = kgC/ha × 0.1).
    detection: DayCent SOC one order of magnitude higher or lower than expected
    fix: Multiply litter_C_kgCha by 0.1 to get gC/m2
    is_unit_trap: true
    automatable: true
