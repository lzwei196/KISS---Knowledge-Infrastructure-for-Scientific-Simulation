      template network for China, electricity prices are in EUR but CWatM expects
      CNY. Off by ~8× at 2024 EUR/CNY exchange rate.
    detection: Irrigation cost > 20 CNY/m3 (prohibitive for all crops)
    fix: Confirm PyPSA network uses CNY/MWh; if EUR, multiply by 8.0 (2024 rate)
    is_unit_trap: true
    automatable: true
