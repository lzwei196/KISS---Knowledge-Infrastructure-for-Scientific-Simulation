    description: The specific pumping energy (kWh/m3) varies widely by aquifer depth,
      pump efficiency, and local lift. Using a single default value ignores spatial
      heterogeneity. Deep well districts (e.g. North Anhui) need 2× more energy
      than shallow Shandong wells.
