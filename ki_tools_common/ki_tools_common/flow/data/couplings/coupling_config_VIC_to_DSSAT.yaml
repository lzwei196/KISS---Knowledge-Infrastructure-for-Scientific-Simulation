# Coupling Config v2: VIC -> DSSAT
# UPDATED 2026-05-21: added soil_moisture → SH2O initialization edge
# Pipeline2 auto-generated only precipitation_rate (exact_canonical). Soil moisture
# was not registered as a canonical DSSAT input, so pipeline2 missed it. This edge
# injects VIC's per-layer soil_moisture [mm] into DSSAT FileX *INITIAL CONDITIONS
# as SH2O [cm³/cm³] before each growing-season run. Without this, DSSAT uses
# generic default SH2O which can produce 20-40% yield error in water-limited years.

coupling_config_version: '2.0'
generated: '2026-05-21'
generator: manual_update_v1
metadata:
  edge_id: VIC_to_DSSAT
  source_model: VIC
  target_model: DSSAT
  source_domain: hydrology
  target_domain: crop
  edge_type: type5_cross_scale_cross_domain
  n_forward_variables: 2
  n_combine_variables: 0
  n_plausible_feedback: 0
  n_review_feedback: 0
  is_feedback: false
  update_note: >
    Added soil_moisture→SH2O edge. The original auto-generated config passed only
    precipitation_rate. Soil moisture initialization matters for water-limited
    rainfed and supplemental-irrigation scenarios in the Huaihe plain: pre-season
    soil water deficit determines early root growth and affects final grain weight.
forward_edges:
- canonical_id: precipitation_rate
  source_canonical_id: precipitation_rate
  target_canonical_id: precipitation_rate
  match_type: exact_canonical
  source_local_name: precipitation
  source_unit: mm/timestep
  target_local_name: precipitation
  target_unit: mm/day
- canonical_id: soil_moisture
  source_canonical_id: soil_moisture
  target_canonical_id: soil_moisture
  match_type: exact_canonical
  source_local_name: soil_moisture              # VIC output SOIL_MOIST (mm per layer)
  source_unit: mm
  target_local_name: SH2O                       # DSSAT FileX *INITIAL CONDITIONS, cm3/cm3
  target_unit: cm3/cm3
  primitives_needed:
    - convert_units
    - map_space
    - align_time
    - transform_semantic
    - validate_boundary
  transform_semantic:
    description: >
      VIC outputs per-layer soil moisture as total mm water in the layer (3 layers by default:
      d1=0.1m, d2=0.3m, d3=1.5m). DSSAT *INITIAL CONDITIONS requires SH2O (volumetric fraction,
      cm³/cm³) at user-specified depths. This edge injects VIC's end-of-previous-month (pre-season)
      layer moisture into DSSAT FileX before each growing-season simulation.
    formula: |
      # VIC layer_depth in mm (from VIC soil parameter file d1, d2, d3)
      # SH2O [cm3/cm3] = soil_moisture_mm / layer_depth_mm
      SH2O_layer1 = VIC_soil_moist_mm[layer1] / (d1_m * 1000)
      SH2O_layer2 = VIC_soil_moist_mm[layer2] / (d2_m * 1000)
      SH2O_layer3 = VIC_soil_moist_mm[layer3] / (d3_m * 1000)
      # Clamp to [SLLL, SSAT] from DSSAT .SOL file to avoid IPSOIL Error 7/8
      SH2O_layerN = max(SLLL_N, min(SSAT_N, SH2O_layerN))
      # Temporal: use VIC soil moisture at end-of-day on (SDATE - 1)
    injection_point: >
      FileX *INITIAL CONDITIONS section — ICBL (depth cm) and SH2O (cm3/cm3) per layer.
      Write one row per VIC layer: ICBL = cumulative depth in cm, SH2O = computed value.
      Use dssat_workdir_setup.py or edit the FileX template before calling run_dssat().

