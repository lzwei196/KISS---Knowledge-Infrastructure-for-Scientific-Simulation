# Diagnostic Triplets Template -- Knowledge Dissection Toolkit
#
# Triplets capture error knowledge in a structured format:
#   error:     What went wrong (observable symptom)
#   diagnosis: Why it went wrong (root cause)
#   remedy:    How to fix it (specific action)
#
# Categories:
#   unit_conversion    -- Wrong units applied to data
#   format_error       -- Wrong file format, column alignment, encoding
#   path_error         -- File not found, path too long, wrong directory
#   config_error       -- Wrong configuration flag, missing parameter
#   build_error        -- Compilation failure, missing dependency
#   runtime_error      -- Crash during execution
#   silent_error       -- Model runs but produces wrong results
#   data_error         -- Missing data, fill values, wrong variable
#   coupling_error     -- Interface mismatch between models

triplets:
  - id: "[MODEL]_001"
    category: "unit_conversion"
    severity: "critical"         # critical | major | minor
    silent: true                 # true if model runs without error
    error: |
      [OBSERVABLE SYMPTOM: e.g., "Model produces near-zero discharge
      (0.001 m3/s) when expected ~500 m3/s"]
    diagnosis: |
      [ROOT CAUSE: e.g., "Precipitation forcing read as mm/day but actual
      NetCDF units are kg/m2/s. Factor 86400x too low."]
    remedy: |
      [SPECIFIC FIX: e.g., "Multiply CMFD prec by 86400 before writing
      to model forcing file. Verify with:
        ds = xr.open_dataset('cmfd_prec.nc')
        print(ds['prec'].attrs['units'])  # should show 'kg m-2 s-1'"]
    discovered_during: "s8_validation"
    affects_models:
      - "[MODEL_NAME]"
    tags:
      - "precipitation"
      - "forcing"

  - id: "[MODEL]_002"
    category: "format_error"
    severity: "major"
    silent: true
    error: |
      [SYMPTOM]
    diagnosis: |
      [ROOT CAUSE]
    remedy: |
      [FIX]
    discovered_during: "s7_binary_test"
    affects_models:
      - "[MODEL_NAME]"
    tags: []

# Common failure patterns (cross-model):
# These are patterns observed across multiple models. Reference them
# by ID when the same pattern recurs.
common_patterns:
  - id: "cfp_001"
    name: "CMFD precipitation unit mismatch"
    description: |
      CMFD precipitation is stored as kg/m2/s but frequently documented
      or assumed to be mm/day. Factor 86400x difference.
    affected_count: 15  # number of models where this was found

  - id: "cfp_002"
    name: "Fortran fixed-width column shift"
    description: |
      Off-by-one column alignment in Fortran FORMAT statements causes
      the model to read wrong parameter values silently.
    affected_count: 9
