# Knowledge Infrastructure (KI) Schema Template
# Knowledge Dissection Toolkit v4.0
#
# This file defines the complete structure of a model's knowledge
# infrastructure package. Fill in values as each dissection stage completes.

model:
  name: "[MODEL_NAME]"
  version: "[VERSION]"
  domain: "[DOMAIN]"
  language: "[Fortran/C/C++/Python/R]"
  license: "[LICENSE]"
  repository: "[URL]"
  citation: "[CITATION]"
  spatial_mode: "[distributed_gridded / semi_distributed_hru / lumped / point]"

# Validation status: one of
#   binary_only | partial_replacement | full_replacement | production_validated
validation_status: "binary_only"

# ---------------------------------------------------------------------------
# Input specification
# ---------------------------------------------------------------------------
inputs:
  forcing:
    variables:
      - name: "precipitation"
        model_unit: "[mm/day]"
        source_unit: "[kg/m2/s]"
        conversion_factor: 86400.0
        conversion_type: "multiplicative"  # or "additive"
      - name: "temperature"
        model_unit: "[degC]"
        source_unit: "[K]"
        conversion_factor: -273.15
        conversion_type: "additive"
      # Add all forcing variables...

    sources:
      primary:
        name: "[YOUR_FORCING_DATASET]"
        resolution: "[0.25 deg / 0.1 deg / point]"
        temporal: "[daily / 3-hourly / hourly]"
        path: "[CONFIGURABLE_PATH]"
      alternatives:
        - name: "[ALTERNATIVE_DATASET]"
          resolution: "[RESOLUTION]"
          temporal: "[FREQUENCY]"

  static:
    soil:
      source: "[YOUR_SOIL_DATABASE]"
      variables: ["sand_pct", "clay_pct", "bulk_density", "Ksat"]
      tool: "tools/build_soil_params.py"
    landcover:
      source: "[YOUR_LANDCOVER]"
      tool: "tools/build_landcover.py"
    topography:
      source: "[YOUR_DEM]"
      resolution: "[RESOLUTION]"
      tool: "tools/build_domain.py"
    routing:
      method: "[D8 / D-infinity / pre-defined]"
      tool: "tools/build_routing.py"

  configuration:
    files:
      - name: "[config_file.txt]"
        format: "[fixed_width / ini / yaml / namelist / xml]"
        template: "templates/[config_file.txt]"
        notes: "[Key format requirements]"

# ---------------------------------------------------------------------------
# Output specification
# ---------------------------------------------------------------------------
outputs:
  primary:
    - variable: "[discharge]"
      unit: "[m3/s]"
      file: "[output.nc]"
      frequency: "[daily]"
  additional:
    - variable: "[evapotranspiration]"
      unit: "[mm/day]"
      file: "[output.nc]"
      frequency: "[daily]"

# ---------------------------------------------------------------------------
# Build specification
# ---------------------------------------------------------------------------
build:
  method: "[cmake / make / configure+make / pip / conda / manual]"
  dependencies:
    - "[dependency_1]"
    - "[dependency_2]"
  binary_path: "[path/to/executable]"
  known_issues:
    - "[Issue and workaround]"

# ---------------------------------------------------------------------------
# Tool inventory
# ---------------------------------------------------------------------------
tools:
  - name: "convert_forcing.py"
    purpose: "Convert forcing data to model-expected format and units"
    inputs: ["raw_forcing_netcdf"]
    outputs: ["model_forcing_files"]
    unit_conversions: true

  - name: "build_soil_params.py"
    purpose: "Extract and format soil parameters from database"
    inputs: ["soil_database", "basin_shapefile"]
    outputs: ["model_soil_file"]

  - name: "run_model.py"
    purpose: "Execute the model with prepared inputs"
    inputs: ["all_prepared_inputs"]
    outputs: ["model_output"]

# ---------------------------------------------------------------------------
# Diagnostic knowledge
# ---------------------------------------------------------------------------
diagnostics:
  n_triplets: 0
  top_categories:
    - "unit_conversion"
    - "format_error"
  error_log_entries: 0

# ---------------------------------------------------------------------------
# Coupling interfaces (if applicable)
# ---------------------------------------------------------------------------
coupling:
  upstream: []
    # - model: "[UPSTREAM_MODEL]"
    #   variable: "[VARIABLE]"
    #   unit: "[UNIT]"
  downstream: []
    # - model: "[DOWNSTREAM_MODEL]"
    #   variable: "[VARIABLE]"
    #   unit: "[UNIT]"

# ---------------------------------------------------------------------------
# Spinup
# ---------------------------------------------------------------------------
spinup:
  required: true
  length_years: 1
  reason: "[Why spinup is needed]"
  discard_from_metrics: true
