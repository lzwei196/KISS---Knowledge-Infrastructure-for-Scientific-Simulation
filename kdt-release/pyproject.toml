[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-dissection-toolkit"
version = "4.0.0"
description = "Systematic extraction of operational knowledge from Earth science models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jianyun Zhang Research Group", email = "hydrocraft@hhu.edu.cn"},
]
keywords = [
    "earth science", "hydrology", "model validation", "unit conversion",
    "knowledge extraction", "forcing data", "calibration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
netcdf = [
    "xarray>=0.19",
    "netCDF4>=1.5",
]
geo = [
    "geopandas>=0.9",
    "shapely>=1.7",
]
all = [
    "xarray>=0.19",
    "netCDF4>=1.5",
    "geopandas>=0.9",
    "shapely>=1.7",
    "pandas>=1.3",
    "scipy>=1.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/[YOUR_ORG]/knowledge-dissection-toolkit"
Documentation = "https://github.com/[YOUR_ORG]/knowledge-dissection-toolkit"
Repository = "https://github.com/[YOUR_ORG]/knowledge-dissection-toolkit"

[tool.setuptools.packages.find]
include = ["ki_tools_common*", "validators*"]

[tool.pytest.ini_options]
testpaths = ["ki_tools_common/tests"]
