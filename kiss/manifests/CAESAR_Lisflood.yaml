kiss_manifest_version: 1
model: CAESAR_Lisflood
binary_type: PE32
verified: partial
install_dir: CAESAR_Lisflood

acquire:
  strategy: build
  repo: https://github.com/dvalters/HAIL-CAESAR.git
  ref: v1.0
  commands:
    - >-
      if not exist bin mkdir bin && g++ -std=c++11 -O2
      -DM_PI=3.14159265358979323846 -D_USE_MATH_DEFINES
      -static-libgcc -static-libstdc++ -I include src/main.cpp
      src/topotools/LSDRaster.cpp src/topotools/LSDIndexRaster.cpp
      src/topotools/LSDStatsTools.cpp src/topotools/LSDShapeTools.cpp
      src/catchmentmodel/LSDCatchmentModel.cpp
      src/catchmentmodel/LSDGrainMatrix.cpp
      src/catchmentmodel/LSDRainfallRunoff.cpp
      -o bin/HAIL-CAESAR.exe
  produces: bin/HAIL-CAESAR.exe

python_deps: []
system_deps: [g++]

reference_case: HAIL-CAESAR.exe

notes: >-
  The upstream Makefile is POSIX-specific and emits bin/hailcaesar. On Windows
  the same v1.0 sources can be compiled directly with g++. The portable recipe
  deliberately omits -fopenmp when no OpenMP runtime is installed, producing
  a scientifically equivalent serial executable instead of blocking setup.

agent_hint: >-
  Build the official dvalters/HAIL-CAESAR v1.0 sources. The expected Windows
  runtime is bin/HAIL-CAESAR.exe. If a working OpenMP runtime is available you
  may add -fopenmp; otherwise use the verified serial command in this manifest.
