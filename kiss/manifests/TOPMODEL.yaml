kiss_manifest_version: 1
model: TOPMODEL
verified: unverified
install_dir: TOPMODEL
acquire:
  strategy: build
  repo: https://github.com/NOAA-OWP/topmodel
  ref: 7e193d3fb3d94ffec448b04bcbe0b5d01c53bb36
  commands:
  - if [ ! -d "$PWD/boost" ]; then git clone --depth 1 --branch boost-1.86.0 https://github.com/boostorg/boost.git
    boost; fi
  - cd boost && git submodule update --init --depth 1 --recursive && ./bootstrap.sh
    && ./b2 --with-serialization -j"$(nproc)" && cd ..
  - export BOOST_ROOT="$PWD/boost"
  - cmake -B cmake_build -S . -DCMAKE_BUILD_TYPE=Release
  - cmake --build cmake_build --target topmodeldriver -j"$(nproc)"
  - cp cmake_build/topmodeldriver run_bmi
  produces: run_bmi
  system_deps:
  - cmake
  - gcc
  - g++
  - make
  - git
  - libboost-serialization-dev
