function inspectStoryPhase(id){let p=(MODEL.story?.phases||[]).find(x=>x.id===id);if(!p)return;let nodes=(p.node_ids||[]).map(nid=>MODEL.graph.nodes.find(n=>n.id===nid)).filter(Boolean);setInspector(`<span class="badge">${isZh()?"科学阶段":"Scientific stage"}</span><h3>${esc(isZh()?p.title_zh:p.title)}</h3><p>${esc(isZh()?p.summary_zh:p.summary)}</p><details class="method"><summary>${isZh()?`技术依据 · ${nodes.length} 项`:`Technical evidence · ${nodes.length} items`}</summary><div style="margin-top:8px">${nodes.map(n=>`<button class="pnode" data-technical-node="${esc(n.id)}"><b>${esc(n.label)}</b><small>${esc(n.detail||n.role||n.kind)}</small></button>`).join("")||"—"}</div></details><div class="inspectactions"><button class="primary" id="phaseask">${T("ask")}</button></div><div class="method">${isZh()?"这一层是从 DAG 语义生成的科学解释；程序名、变量名和文件位置不会丢失，只在技术依据中显示。":"This layer is a scientific explanation projected from DAG semantics. Program names, variables and files remain available under Technical evidence."}</div>`);document.querySelectorAll("[data-technical-node]").forEach(x=>x.onclick=()=>inspectPipeline(x.dataset.technicalNode));$("#phaseask").onclick=()=>askAgent(MODEL.name,isZh()?`请用简单语言解释 ${MODEL.name} 的“${p.title_zh}”阶段：为什么需要它、依据哪些数据、如何判断完成。`:`Explain the “${p.title}” stage of ${MODEL.name} in plain language: why it is needed, what evidence it uses, and how completion is checked.`)}
$("#detail").addEventListener("click",event=>{let phase=event.target.closest("[data-phase]");if(phase)inspectStoryPhase(phase.dataset.phase)});
function inspectPipeline(id){let n=MODEL.graph.nodes.find(x=>x.id===id);if(!n)return;setInspector(`<h3>${esc(n.label)}</h3><span class="badge">${esc(n.kind)}</span><p>${esc(n.detail||"")}</p>${n.items?`<div>${n.items.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</div>`:""}<div class="inspectactions"><button class="primary" id="nodeask">${T("ask")}</button></div><div class="method">${isZh()?"这是 KI 的技术依据，直接来自 dag.yaml；观测台没有执行 KI 代码。":"This is technical evidence from dag.yaml; the Observatory did not execute KI code."}</div>`);$("#nodeask").onclick=()=>askAgent(MODEL.name,isZh()?`在 ${MODEL.name} KI 中，${n.label} 是什么？它需要什么输入，会产生什么输出，如何检查？`:`In ${MODEL.name}, what is ${n.label}, what does it require and produce, and how is it checked?`)}
let ASK_PENDING=false;
async function askAgent(model,prompt){
  if(ASK_PENDING)return;ASK_PENDING=true;
  const pressed=document.activeElement instanceof HTMLButtonElement?document.activeElement:null;
  const old=pressed?.textContent;
  if(pressed){pressed.disabled=true;pressed.textContent=isZh()?"正在创建新对话…":"Creating a new chat…"}
  try{
    const response=await fetch("/api/sessions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({models:[model]})});
    const created=await response.json().catch(()=>({}));
    if(!response.ok||!created.id)throw new Error(created.error||`${response.status} ${response.statusText}`);
    sessionStorage.setItem(`kiss.draft.${created.id}`,prompt);
    sessionStorage.setItem(`kiss.autosend.${created.id}`,"1");
    location.href=`/?session=${encodeURIComponent(created.id)}`;
  }catch(error){
    setInspector(`<span class="badge warn">${isZh()?"无法创建对话":"Could not create chat"}</span><h3>${isZh()?"没有使用旧对话":"No existing chat was reused"}</h3><p>${esc(error.message||String(error))}</p><div class="method">${isZh()?"请关闭后重试；当前问题没有发送，也没有修改任何已有项目。":"Retry after closing this message. The question was not sent and no existing project was changed."}</div>`);
    ASK_PENDING=false;
    if(pressed){pressed.disabled=false;pressed.textContent=old}
  }
}
async function loadLive(sid){if(!sid){CURRENT=null;drawLive();show("live");return}CURRENT=await fetch(`/api/observatory/session/${encodeURIComponent(sid)}`).then(r=>r.json());drawLive();show("live")}
function drawLive(){if(!CURRENT){$("#live").innerHTML=`<div class="livehero"><h2>${isZh()?"选择一个对话项目":"Choose a chat project"}</h2><p>${isZh()?"观测台会显示 Agent、KI、数据和结果的真实状态。":"The Observatory shows the real Agent, KI, data and result state."}</p></div>`;return}let r=CURRENT.run||{},a=CURRENT.agent||{},stages=["understanding","choosing_ki","software","researching","preparing","validating","running","results"],idx=stages.indexOf(r.stage),state=r.status||a.state||"idle";$("#live").innerHTML=`<div class="livehero"><div class="livehead"><i class="pulse ${esc(state)}"></i><div><h2>${esc(CURRENT.session.title)}</h2><div>${esc(a.activity_detail||r.summary||a.activity||T("idle"))}</div><small>${esc((r.selected_kis||CURRENT.session.models||[]).join(" · "))} · ${a.elapsed_seconds||0}s</small></div><div class="spacer"></div>${r.status==="waiting_for_user"?`<span class="badge warn">${T("waiting")}</span>`:""}</div><div class="steps">${stages.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'active':''}">${i<idx?'✓ ':i===idx?'● ':''}${esc(s.replace('_',' '))}</div>`).join("")}</div></div><div class="livegrid"><div class="livecard"><h3>Agent</h3><pre>${esc(JSON.stringify({state:a.state,provider:a.provider,process_alive:a.process_alive,activity:a.activity,activity_detail:a.activity_detail,event_silence_seconds:a.event_silence_seconds},null,2))}</pre></div><div class="livecard"><h3>${T("artifacts")}</h3><p>${esc(CURRENT.view?.title||CURRENT.view?.description||(isZh()?"尚未发布专用项目展示":"No specialized project view published yet"))}</p></div></div>`}
function show(w){$("#atlas").style.display=w==="atlas"?"block":"none";$("#detail").style.display=w==="detail"?"block":"none";$("#live").style.display=w==="live"?"block":"none";["atlas","detail","live"].forEach(x=>$(`#tab${x}`).classList.toggle("on",x===w))}
$("#atlas").addEventListener("pointerdown",e=>{if(e.target.closest("[data-action]"))return;drag={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};$("#atlas").setPointerCapture(e.pointerId);$("#atlas").classList.add("drag")});$("#atlas").addEventListener("pointermove",e=>{if(!drag)return;transform.x=drag.tx+(e.clientX-drag.x)*1500/$("#atlas").clientWidth;transform.y=drag.ty+(e.clientY-drag.y)*950/$("#atlas").clientHeight;applyTransform()});$("#atlas").addEventListener("pointerup",()=>{drag=null;$("#atlas").classList.remove("drag")});$("#atlas").addEventListener("wheel",e=>{e.preventDefault();transform.k=Math.max(.6,Math.min(2.4,transform.k*(e.deltaY>0?.9:1.1)));applyTransform()},{passive:false});
$("#search").oninput=e=>{STATE.query=e.target.value.trim();STATE.selected="";renderAtlas();if(STATE.query)emptyInspector()};$("#relation").onchange=e=>{STATE.relation=e.target.value;renderAtlas();if(STATE.selected)inspectKI(STATE.selected)};$("#reset").onclick=showDomains;$("#tabatlas").onclick=()=>show("atlas");$("#tabdetail").onclick=()=>MODEL?show("detail"):STATE.selected?openModel(STATE.selected):null;$("#tablive").onclick=()=>{drawLive();show("live")};$("#session").onchange=e=>loadLive(e.target.value);$("#closeinspector").onclick=()=>$("#inspector").classList.remove("open");$("#theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("kiss-dark",document.body.classList.contains("dark")?"1":"0")};if(localStorage.getItem("kiss-dark")==="1"||(!localStorage.getItem("kiss-dark")&&matchMedia("(prefers-color-scheme:dark)").matches))document.body.classList.add("dark");window.addEventListener("geoforge:language",localize);
async function start(){[DATA,SESSIONS]=await Promise.all([fetch("/api/observatory").then(r=>r.json()),fetch("/api/sessions").then(r=>r.json())]);$("#session").innerHTML=`<option value="">${isZh()?"实时项目…":"Live project…"}</option>`+SESSIONS.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");localize();showDomains();let p=new URLSearchParams(location.search);if(p.get("model"))openModel(p.get("model"));if(p.get("session")){$("#session").value=p.get("session");loadLive(p.get("session"))}}start().catch(e=>{$("#inspectbody").textContent=e.message||e});
</script></body></html>
